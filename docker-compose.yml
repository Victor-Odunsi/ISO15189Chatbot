services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=iso15189
      - POSTGRES_PASSWORD=iso15189
      - POSTGRES_DB=iso15189
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iso15189"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Must be the browser-reachable origin (what the browser's Origin
      # header actually is), not a docker-internal service hostname.
      - FRONTEND_ORIGIN=http://localhost:3000
      - DATABASE_URL=postgresql+asyncpg://iso15189:iso15189@postgres:5432/iso15189
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      # Must be browser-reachable -- fetch() calls run in the user's
      # browser, not inside the frontend container's network.
      - NEXT_PUBLIC_API_URL=http://localhost:8000

volumes:
  postgres_data:
