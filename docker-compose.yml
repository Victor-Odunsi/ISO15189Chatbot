services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=iso15189
      - POSTGRES_PASSWORD=iso15189
      - POSTGRES_DB=iso15189
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iso15189"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/chroma_db:/app/chroma_db
    environment:
      - FRONTEND_ORIGIN=http://frontend:8501
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - DATABASE_URL=postgresql+asyncpg://iso15189:iso15189@postgres:5432/iso15189
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:8000

volumes:
  postgres_data:
